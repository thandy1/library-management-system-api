[project]
name = "library-management-system-api"
version = "0.1.0"
description = "A REST API for managing library books and members"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "email-validator==2.3.0",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.2.0",
    "schemathesis>=4.33.4",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
